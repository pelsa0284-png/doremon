
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doraemon Friends Quiz</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body class="theme-sky">

    <div class="theme-page" id="themePage">
        <h1>💙 Doraemon Friends Quiz 💙</h1>
      <p id="selectedMessage"></p>

        <div class="theme-options">
            <button class="theme-btn" onclick="selectTheme('sky')">
                ☁️ Sky Blue
                <img src="sky.jpg" alt="Sky Blue theme">
            </button>

            <button class="theme-btn" onclick="selectTheme('pink')">
                💗 Pink
                <img src="pink.jpg" alt="Pink theme">
            </button>

            <button class="theme-btn" onclick="selectTheme('green')">
                🌿 Green
                <img src="green.jpg" alt="Green theme">
            </button>

            <button class="theme-btn" onclick="selectTheme('purple')">
                💜 Purple
                <img src="purple.jpg" alt="Purple theme">
            </button>
        </div>

       
        <button class="start-btn" onclick="startQuiz()">
            Start Quiz ➜
        </button>
    </div>



<div id="quizPage" hidden>
    <h1>💙 Doraemon Friends Quiz 💙</h1>
    <p>Let's check our friendship, Nobita!</p>

    <h2 id="question"></h2>

    <div class="answers">
    <button type="button"></button>
    <button type="button"></button>
    <button type="button"></button>
    <button type="button"></button>
</div>

    <p id="result"></p>
    <p id="score"></p>
    
<div id="friendshipGreeting" hidden>
    <h2 id="greetingTitle"></h2>
    <p id="greetingMessage"></p>
</div>




    <button id="nextBtn" onclick="nextQuestion()" hidden>
        Next Question ➜
    </button>

    <button onclick="goBack()">⬅ Back to Themes</button>
</div>

<!-- SCORE PAGE -->
<div id="scorePage" hidden>
    <h1>🏆 Your Quiz Result 🏆</h1>
    <h2 id="finalScore"></h2>
    <p id="scoreMessage"></p>
    <button onclick="showGreetingPage()">Continue 💌</button>
</div>

<!-- GREETING PAGE -->
<div id="greetingPage" hidden>
    <h1>💙 A Special Letter for You 💙</h1>
    <p>Someone has a friendship message for you!</p>

    <button id="envelopeBtn" onclick="openLetter()"
        style="font-size:70px; background:none; border:none; cursor:pointer;">
        💌
    </button>

    <p>Tap the letter to open it!</p>

    <div id="letterContent" hidden>
        <h2 id="letterTitle"></h2>
        <p id="letterMessage"></p>
        <p>With lots of friendship 💙</p>
    </div>

    <button onclick="goBack()">⬅ Play Again</button>
</div>
    
<div id="letterContent" hidden>
    <img src="friendship-card.png"
         alt="Best Friends Forever"
         class="friendship-card">
</div>

</body>
</html>
